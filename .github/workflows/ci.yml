name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1.1

    - name: Build C++ VRModFramework (DLL)
      run: |
        cd VRModFramework
        mkdir build
        cd build
        cmake .. -A x64
        cmake --build . --config Release

    - name: Run C++ Unit Tests (Catch2)
      run: |
        cd VRModFramework/build
        ctest -C Release --output-on-failure

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Build React & Electron Launcher
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        cd UVRLauncher
        npm install
        
        # Dynamically bump version using GitHub Run Number for auto-updates
        node -e "const fs = require('fs'); const p = JSON.parse(fs.readFileSync('package.json')); p.version = '1.0.${{ github.run_number }}'; fs.writeFileSync('package.json', JSON.stringify(p, null, 2));"
        
        npx vite build
        npx electron-builder --win
      
    - name: Publish Release using GitHub CLI
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        cd UVRLauncher
        gh release create "v1.0.${{ github.run_number }}" ./release/*.exe ./release/latest.yml --title "Update v1.0.${{ github.run_number }}" --generate-notes
        
    - name: Upload Desktop App Installer
      uses: actions/upload-artifact@v4
      with:
        name: UVRLauncher-Windows
        path: UVRLauncher/release/*.exe
