name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1.1

    - name: Build C++ VRModFramework (DLL & Injector)
      run: |
        cd VRModFramework
        mkdir build
        cd build
        cmake .. -A x64
        cmake --build . --config Release
        Get-ChildItem -Path . -Recurse -Filter openxr_loader.dll | Copy-Item -Destination .\Release\openxr_loader.dll -Force

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Build React & Electron Launcher
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        cd UVRLauncher
        npm install
        
        # Dynamically bump version using GitHub Run Number for auto-updates
        $version = "1.0.${{ github.run_number }}"
        (Get-Content package.json) -replace '"version": "1.0.0"', `"version": "$version"` | Set-Content package.json
        
        npx vite build
        npx electron-builder --win --publish always
      
    - name: Upload Desktop App Installer
      uses: actions/upload-artifact@v4
      with:
        name: UVRLauncher-App
        path: UVRLauncher/release/*.exe
